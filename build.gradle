plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.aws.lab'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // AWS SDK v2
    implementation platform('software.amazon.awssdk:bom:2.29.1')
    implementation 'software.amazon.awssdk:bedrockruntime'
    implementation 'software.amazon.awssdk:sagemakerruntime'
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:sqs'

    // PostgreSQL, pgvector, and Redis
    implementation 'org.postgresql:postgresql:42.7.2'
    implementation 'com.pgvector:pgvector:0.1.6'
    implementation 'redis.clients:jedis:5.1.0'

    // JSON Processing
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
}

application {
    mainClass = project.findProperty('mainClass') ?: 'com.aws.lab.DocLabApplication'
}

bootRun {
    standardInput = System.in
}

run {
    standardInput = System.in
}
